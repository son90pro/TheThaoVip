name: Auto Update ChuoiChien M3U Playlist

on:
  schedule:
    # Chạy tự động mỗi 30 phút một lần
    - cron: '*/30 * * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run script generate_m3u.py
      run: python generate_m3u.py

    - name: Commit and push playlist.m3u
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        if [ -f playlist.m3u ]; then
          git add playlist.m3u
          git diff-index --quiet HEAD || git commit -m "Auto updated playlist.m3u"
          git push
        else
          echo "Error: File playlist.m3u không tồn tại!"
          exit 1
        fi
        
