name: Auto Scrape M3U Playlist

on:
  schedule:
    # Chạy tự động mỗi 2 tiếng 1 lần (giờ UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Cho phép bấm nút chạy thủ công bất cứ lúc nào trên GitHub

jobs:
  scrape-job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright
        playwright install chromium
        playwright install-deps

    - name: Run Scraper Script
      run: python scraper.py

    - name: Commit and Push updated playlist
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add playlist.m3u
        git commit -m "Auto update playlist.m3u [skip ci]" || exit 0
        git push
        
